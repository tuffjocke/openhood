# Publishes the `openhood` npm package (the CLI and MCP server) when a version tag is pushed:
#   1. bump "version" in package.json, commit
#   2. git tag v0.1.1 && git push --tags
# Needs the NPM_TOKEN secret (an npm "automation" token for the openhood package).
name: Publish to npm
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run build:npm
      - run: npm publish dist/npm --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
