# Publishes the `openhood` npm package (the CLI and MCP server) when package.json's version isn't on
# npm yet. To release: bump "version" in package.json and push to main. Pushing a v* tag works too.
# Needs the NPM_TOKEN secret (an npm token that can publish the openhood package).
name: Publish to npm
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/npm.yml]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Is this version new?
        id: version
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "openhood@$v" version >/dev/null 2>&1; then echo "openhood $v is already on npm"; echo "new=false" >> "$GITHUB_OUTPUT"
          else echo "Publishing openhood $v"; echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.new == 'true'
        run: npm ci
      - if: steps.version.outputs.new == 'true'
        run: npm run check
      - if: steps.version.outputs.new == 'true'
        run: npm run build:npm
      - if: steps.version.outputs.new == 'true'
        run: npm publish dist/npm --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
